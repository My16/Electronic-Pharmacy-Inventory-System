<div class="med-picker">
    <label class="med-picker-label">Medicine <span style="color:#dc2626">*</span></label>

    <div class="med-picker-input-wrap">
        <input type="text"
               id="{{ tab }}_search_input"
               class="med-picker-search"
               placeholder="Search by name, stock code, generic, barcode…"
               autocomplete="off">
        <button type="button"
                class="med-picker-scan-btn"
                title="Scan barcode with camera"
                style="color:#00ADB5"
                onclick="openScanner(function(code){ scanPick('{{ tab }}', code); })">
            <i class="fas fa-camera"></i>
        </button>
    </div>

    <!-- Results dropdown -->
    <div class="med-picker-dropdown" id="{{ tab }}_picker_dropdown"></div>
</div>
